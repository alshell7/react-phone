name: React Native
on:
  push:
    paths: ["native/**", "docs/**", ".github/workflows/native.yml"]
  pull_request:
    # `labeled` lets a maintainer opt a PR into the live PBX job with `live-sip`.
    types: [opened, synchronize, reopened, labeled]
    paths: ["native/**", "docs/**", ".github/workflows/native.yml"]
  # Manual runs can also exercise a real PBX (see the live job).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Adding a label changes no code, so it only starts the live job.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      # publish/ freshness, TypeScript (library + example), unit and component tests.
      - run: npm run check
      - run: npm run playground:build
      - run: npx playwright install --with-deps chromium
      # Desktop + mobile UI suites and real SIP/WebRTC calls on a local registrar.
      - run: npx playwright test
      - run: npm run publish:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: native/test-results

  # Real PBX: registration and a controlled call from the web build. Runs only on
  # manual dispatch or when a maintainer labels the PR `live-sip`, so routine runs
  # never use the account. Add SIP_WSS_URL, SIP_URI, SIP_USERNAME, SIP_PASSWORD,
  # and SIP_TEST_TARGET as repository secrets; without them the tests skip.
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'live-sip')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    env:
      SIP_WSS_URL: ${{ secrets.SIP_WSS_URL }}
      SIP_URI: ${{ secrets.SIP_URI }}
      SIP_USERNAME: ${{ secrets.SIP_USERNAME }}
      SIP_PASSWORD: ${{ secrets.SIP_PASSWORD }}
      SIP_TEST_TARGET: ${{ secrets.SIP_TEST_TARGET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run test:live
      - run: npm run playground:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live:call
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-sip-report
          path: native/test-results
