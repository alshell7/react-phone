name: React Native
on:
  push:
    paths: ["native/**", "docs/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "docs/**", ".github/workflows/native.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      # publish/ freshness, TypeScript (library + example), unit and component tests.
      - run: npm run check
      - run: npm run playground:build
      - run: npx playwright install --with-deps chromium
      # Desktop + mobile UI suites and real SIP/WebRTC calls on a local registrar.
      - run: npx playwright test
      - run: npm run publish:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: native/test-results
