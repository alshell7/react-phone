name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        run: npx jsr publish
  publish-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Stage only the publishable files and runtime dependencies (see native/scripts/stage-jsr.mjs).
      - name: Stage React Native package
        working-directory: native
        run: node scripts/stage-jsr.mjs
      - name: Publish React Native package
        working-directory: native/.jsr-stage
        run: npx jsr publish
